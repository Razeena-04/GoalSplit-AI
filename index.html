<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoalSplit AI — Turn Goals Into Daily Action</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <div class="page-wrapper">
    <!-- Header -->
    <header class="site-header">
      <div class="logo">◈ GoalSplit <em>AI</em></div>
      <p class="tagline">Transform your biggest goals into achievable daily steps.</p>
    </header>

    <!-- Form Card -->
    <section class="card form-card" id="formSection">
      <div class="card-label">New Goal Plan</div>
      <h2 class="card-title">What do you want to achieve?</h2>

      <div class="field-group">
        <label for="goal">Your Goal</label>
        <textarea id="goal" placeholder="e.g. Learn Python and build a web app" rows="3"></textarea>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="days">Deadline (days)</label>
          <input type="number" id="days" placeholder="30" min="1" max="365" />
        </div>
        <div class="field-group">
          <label for="hours">Hours / day</label>
          <input type="number" id="hours" placeholder="2" min="0.5" max="24" step="0.5" />
        </div>
      </div>

      <!-- Mode Toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeAI" onclick="setMode('ai')">🤖 AI Plan</button>
        <button class="mode-btn" id="modeRandom" onclick="setMode('random')">🎲 Quick Plan</button>
      </div>

      <!-- API Key (shown only in AI mode) -->
      <div class="field-group" id="apiKeyGroup">
        <label for="apiKey">Claude API Key <a href="https://console.anthropic.com/" target="_blank" class="link">Get one →</a></label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." />
        <p class="hint">Your key is never stored — only used in this session.</p>
      </div>

      <p class="error-msg" id="errorMsg"></p>
      <button class="btn-primary" id="generateBtn" onclick="generatePlan()">Generate My Plan →</button>
    </section>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p class="loading-text">Generating your plan...</p>
    </div>

    <!-- Results -->
    <section class="results-section" id="resultsSection">
      <div id="resultsHeader"></div>
      <div class="plan-grid" id="planGrid"></div>
      <button class="btn-secondary" onclick="resetForm()">← Plan Another Goal</button>
    </section>
  </div>

  <footer class="site-footer">
    <p>GoalSplit AI — Powered by Claude</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
